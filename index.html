<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Написать письмо — склад</title>
<style>body{margin:0;background:#f4f5f7;font-family:system-ui,Arial,sans-serif;color:#202124;display:grid;min-height:100dvh;place-items:center}.card{background:white;border-radius:20px;padding:30px 22px;max-width:390px;width:calc(100% - 56px);box-shadow:0 8px 32px #0001;text-align:center}h1{font-size:25px}p{line-height:1.5;color:#555}a.button{display:block;background:#1769e0;color:white;text-decoration:none;border-radius:12px;padding:17px 10px;font-size:19px;font-weight:700;margin:25px 0 16px}.email{overflow-wrap:anywhere;font-weight:600;color:#333}.small{font-size:13px}</style>
</head><body><main class="card"><h1>✉️ Написать письмо</h1><p>Нажмите кнопку, чтобы открыть почту с заполненным получателем.</p><a class="button" id="send" href="mailto:abdrakhmanov.kirill@krasnoe-beloe.ru">Написать письмо</a><p class="email">abdrakhmanov.kirill@krasnoe-beloe.ru</p><p class="small">Если почта не открылась автоматически, нажмите кнопку. Письмо отправляется только после вашего подтверждения.</p></main><script>window.addEventListener('load',()=>{setTimeout(()=>{window.location.href=document.getElementById('send').href},450)})</script></body></html>
